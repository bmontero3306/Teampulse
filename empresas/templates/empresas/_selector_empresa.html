{% load empresas_tags %}
{% if user.is_authenticated and user.rol == "superadmin" %}
{% empresas_para_selector as empresas_selector %}
<form method="post" class="mt-0.5 max-w-xs" id="form-selector-empresa">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.path }}">
    <label for="selector-empresa" class="sr-only">Seleccionar empresa</label>
    <select
        id="selector-empresa"
        class="block w-full truncate rounded-lg border border-slate-300 bg-white px-2 py-1 text-sm text-slate-800 shadow-sm focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500"
        onchange="if (this.value) { this.form.action = this.value; this.form.submit(); }"
    >
        <option value="" disabled {% if not empresa_actual %}selected{% endif %}>Elegí una empresa</option>
        {% for emp in empresas_selector %}
        <option
            value="{% url 'empresas:seleccionar' emp.pk %}"
            {% if empresa_actual and empresa_actual.pk == emp.pk %}selected{% endif %}
        >
            {{ emp.nombre }}
        </option>
        {% endfor %}
    </select>
</form>
{% endif %}
