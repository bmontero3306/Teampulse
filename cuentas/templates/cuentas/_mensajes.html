{% if messages %}
<ul class="mb-4 space-y-2">
    {% for message in messages %}
    <li class="rounded-lg border px-4 py-3 text-sm {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% elif message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800{% else %}border-sky-200 bg-sky-50 text-sky-800{% endif %}">
        {{ message }}
    </li>
    {% endfor %}
</ul>
{% endif %}
{% if form and form.non_field_errors %}
<div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">
    {{ form.non_field_errors }}
</div>
{% endif %}
