<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
</head>
<body style="margin:0;padding:0;background:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;padding:24px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:24px;">
                    <tr>
                        <td>
                            <p style="margin:0 0 8px;font-size:13px;font-weight:600;color:#0369a1;">TeamPulse</p>
                            <h1 style="margin:0 0 16px;font-size:20px;line-height:1.3;">{{ titulo }}</h1>
                            <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#334155;">{{ mensaje }}</p>
                            {% if url %}
                            <p style="margin:0 0 16px;">
                                <a href="{{ url }}" style="display:inline-block;background:#0284c7;color:#ffffff;text-decoration:none;padding:10px 16px;border-radius:8px;font-size:14px;">Ver en TeamPulse</a>
                            </p>
                            {% endif %}
                            <p style="margin:16px 0 0;font-size:12px;color:#94a3b8;">Este mensaje se envió automáticamente. No respondas este correo.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
