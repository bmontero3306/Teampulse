{% extends "app_shell.html" %}

{% block page_title %}{{ titulo }}{% endblock %}

{% block content %}
<section class="mx-auto max-w-lg">
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        <h1 class="text-2xl font-semibold tracking-tight text-slate-900">{{ titulo }}</h1>
        <p class="mt-3 text-sm text-slate-600">{{ mensaje }}</p>
        <form method="post" class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
            {% csrf_token %}
            <a href="{% url 'evaluaciones:ciclo_detalle' ciclo.pk %}" class="inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">
                Volver
            </a>
            <button type="submit" class="inline-flex items-center justify-center rounded-lg px-4 py-2 text-sm font-semibold text-white {% if peligro %}bg-red-600 hover:bg-red-700{% else %}bg-sky-600 hover:bg-sky-700{% endif %}">
                {{ confirmacion }}
            </button>
        </form>
    </div>
</section>
{% endblock %}
